[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-recognition"
version = "0.1.0"
description = "Proof of concept: real-time facial emotion recognition on video streams with open models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "onnxruntime>=1.16",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
emotion-recognition = "emotion_recognition.cli:main"
emotion-recognition-web = "emotion_recognition.server:main"

[tool.setuptools]
packages = ["emotion_recognition"]

[tool.setuptools.package-data]
emotion_recognition = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
